# gPTP lab: separate containers for grandmasters, an L2 switch, and the
# slave monitor, wired like the vehicle network. See lab/README.md.
#
#   docker compose -f lab/compose.yaml up -d --build
#   docker compose -f lab/compose.yaml logs -f monitor
#   lab/run.sh            # scripted fault scenarios with checks

name: gptp-lab

x-node: &node
  image: gptp-lab
  pull_policy: never # built locally by the fwd-mask service
  cap_add: [NET_ADMIN, NET_RAW]
  init: true
  depends_on:
    switch:
      condition: service_healthy

volumes:
  out:

networks:
  gm_side:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: gptplab-gm
    ipam:
      config: [{ subnet: 10.77.1.0/24 }]
  sensor_side:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: gptplab-sn
    ipam:
      config: [{ subnet: 10.77.2.0/24 }]

services:
  # One-shot helper on the host: Docker's bridges drop the gPTP multicast
  # (link-local 01:80:C2:00:00:0E) unless group_fwd_mask allows it.
  fwd-mask:
    image: gptp-lab
    build:
      context: ..
      dockerfile: lab/Dockerfile
    network_mode: host
    cap_add: [NET_ADMIN]
    command:
      - sh
      - -c
      - for b in gptplab-gm gptplab-sn; do ip link set $$b type bridge group_fwd_mask 0x4000; done

  # The automotive Ethernet switch: an L2 bridge between both networks.
  switch:
    image: gptp-lab
    pull_policy: never
    cap_add: [NET_ADMIN]
    init: true
    networks: [gm_side, sensor_side]
    command: [lab-switch]
    depends_on:
      fwd-mask:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, test, -f, /run/lab/ready]
      interval: 1s
      retries: 30

  # The Pi grandmaster (priority1 1), also serving IEEE 1588 over UDP for
  # ptp-device. GM_ARGS adds options, e.g. --handover 1
  gm:
    <<: *node
    networks: [gm_side]
    command: sh -c "exec gptp-gm eth0 --no-tui --ptp udp $${GM_ARGS:-}"
    environment:
      GM_ARGS: ${GM_ARGS:-}

  # Stand-in for the switch's own grandmaster: priority1 200, and its time
  # is deliberately 1 s off (--time-error 1), so a failover shows up as a
  # time step.
  gm-backup:
    <<: *node
    networks: [gm_side]
    command: gptp-gm eth0 --no-tui --no-inventory --priority1 200 --time-error 1

  # The slave monitor on the sensor side, headless; JSONL metrics and CSV
  # captures go to the "out" volume (lab/run.sh copies them to lab/out/).
  monitor:
    <<: *node
    networks: [sensor_side]
    command: >
      gptp-gm eth0 --monitor --no-tui
      --log-metrics /out/metrics.jsonl --capture-dir /out/captures
    volumes:
      - out:/out

  # A device that speaks only IEEE 1588 (UDP, end-to-end delay), next to the
  # gPTP monitor: ptp4l as slave, measuring without adjusting the clock.
  ptp-device:
    <<: *node
    networks: [sensor_side]
    command: >
      ptp4l -i eth0 -4 -E -S -s -m --free_running 1 --summary_interval 2

  # The slave monitor watching the GM's IEEE 1588 (UDP, end-to-end delay)
  # instead of gPTP.
  monitor-1588:
    <<: *node
    networks: [sensor_side]
    command: gptp-gm eth0 --monitor --no-tui --no-inventory --ptp udp

  # A foreign 1588 master: ptp4l over Ethernet in domain 5, watched from the
  # sensor side by monitor-l2.
  ptp-master:
    <<: *node
    networks: [gm_side]
    command: >
      ptp4l -i eth0 -2 -E -S -m --domainNumber 5 --priority1 10
      --free_running 1 --summary_interval 2
  monitor-l2:
    <<: *node
    networks: [sensor_side]
    command: >
      gptp-gm eth0 --monitor --no-tui --no-inventory --ptp l2 --ptp-domain 5

  # Interactive monitor TUI:
  #   docker compose -f lab/compose.yaml run --rm monitor-tui
  monitor-tui:
    <<: *node
    profiles: [tui]
    networks: [sensor_side]
    tty: true
    stdin_open: true
    command: gptp-gm eth0 --monitor
