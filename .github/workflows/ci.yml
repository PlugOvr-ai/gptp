name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs the full CI first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh lab/*.sh

  test:
    name: Build & test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35): the binaries also run on Raspberry
          # Pi OS Bookworm (glibc 2.36) and newer.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Integration tests (network namespaces)
        run: |
          # netem for the jitter scenario; skipped by the script if missing
          sudo modprobe sch_netem || true
          sudo scripts/integration-test.sh target/release/gptp-gm
      - uses: actions/upload-artifact@v4
        with:
          name: gptp-gm-linux-${{ matrix.arch }}
          path: target/release/gptp-gm
          if-no-files-found: error

  static:
    # The release ships static musl binaries, including 32-bit ARM (Pi
    # Zero..4 with a 32-bit OS): catch libc/ABI differences on every push.
    name: Static build (armv7 musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build and test under qemu
        run: cross test --locked --target armv7-unknown-linux-musleabihf

  lab:
    name: Docker lab
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load netem
        run: sudo modprobe sch_netem || true
      - name: Run lab scenarios
        run: lab/run.sh
      - name: Upload lab results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-results
          path: lab/out/
          if-no-files-found: ignore
